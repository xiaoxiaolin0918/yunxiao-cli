name: ci

on:
  push:
    branches: [main]
  # No branches filter: stacked PRs (base != main) get the same CI (#109).
  pull_request:

# Cancel superseded runs of the same branch/PR (#109).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check command docs
        run: python scripts/check_command_docs.py
