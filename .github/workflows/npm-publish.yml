name: npm-publish

# Transition auth model (read docs/wiki/00-process/npm-oidc-publish.md):
# - Today: still needs secrets.NPM_TOKEN (NODE_AUTH_TOKEN) until npm Trusted Publisher is configured.
# - After Trusted Publisher works for sanzhi-yunxiao-cli: remove NPM_TOKEN and keep OIDC + --provenance only.
# Manual dispatch only. Primary install path remains GitHub Releases.
#
# IMPORTANT (#105): do NOT checkout the release tag for publish. Tags are cut
# before chore/checksums-* refreshes npm/checksums.txt, so tag trees always
# carry the previous version's checksums. Checkout a ref that already has the
# refreshed checksums (usually main after the checksums PR), and use `tag`
# only as the version identity to verify.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag whose version to publish (e.g. v0.16.29). Version only — not the checkout ref."
        required: true
        type: string
      ref:
        description: "Git ref that already contains refreshed npm/checksums.txt + matching npm/package.json (default: main)"
        required: false
        default: main
        type: string
      dry_run:
        description: "If true, verify + npm publish --dry-run (no registry write)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize inputs
        id: meta
        run: |
          set -euo pipefail
          raw="${{ inputs.tag }}"
          ver="${raw#v}"
          if [[ -z "$ver" ]]; then
            echo "invalid tag: ${raw}" >&2
            exit 1
          fi
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${ver}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Verify package.json version matches tag
        run: |
          set -euo pipefail
          ver="${{ steps.meta.outputs.ver }}"
          pkg_ver="$(node -p "require('./npm/package.json').version")"
          if [[ "$pkg_ver" != "$ver" ]]; then
            echo "npm/package.json version (${pkg_ver}) != tag version (${ver}) on ref ${{ steps.meta.outputs.ref }}" >&2
            echo "Publish from the commit where package.json and checksums were refreshed for this release." >&2
            exit 1
          fi
          echo "package.json version OK: ${pkg_ver}"

      - name: Verify npm/checksums.txt covers this version
        run: |
          set -euo pipefail
          ver="${{ steps.meta.outputs.ver }}"
          if ! grep -F "yunxiao-cli-${ver}-" npm/checksums.txt; then
            echo "npm/checksums.txt on ref ${{ steps.meta.outputs.ref }} has no yunxiao-cli-${ver}- entries" >&2
            echo "Merge the chore/checksums-${ver} PR (or pass ref=<checksums commit>) before publishing." >&2
            exit 1
          fi

      - name: Compare npm/checksums.txt to GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_name="${{ steps.meta.outputs.tag_name }}"
          tmp="$(mktemp)"
          gh release download "$tag_name" --repo "${{ github.repository }}" --pattern checksums.txt --output "$tmp"
          # Normalize CRLF in case a future runner/checkout introduces them (#108 notes Windows autocrlf).
          tr -d "\r" < "$tmp" > "${tmp}.lf"
          tr -d "\r" < npm/checksums.txt > "${tmp}.repo.lf"
          if ! diff -u "${tmp}.lf" "${tmp}.repo.lf"; then
            echo "npm/checksums.txt on ref ${{ steps.meta.outputs.ref }} differs from Release ${tag_name} asset" >&2
            exit 1
          fi
          echo "checksums match Release ${tag_name}"

      - name: Publish (dry-run)
        if: ${{ inputs.dry_run }}
        working-directory: npm
        # No --provenance / token: dry-run only packs and prints; verifies prepack/sync-profiles.
        run: npm publish --access public --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
